<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آنلاین شاپ آتنا | فروشگاه آنلاین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfcfd;--soft:#eef1f6;--ink:#1b2130;--dark:#1b2130;--coral:#8f72f5;--pink:#e56fb0;--mut:#6b7482;--line:#e3e7ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--soft:#1a1f29;--ink:#eef0f4;--dark:#080a0e;--mut:#9aa3b0;--line:#272d39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--soft:#1a1f29;--ink:#eef0f4;--dark:#080a0e;--mut:#9aa3b0;--line:#272d39;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
.w{max-width:1120px;margin:auto;padding:0 20px;position:relative}
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:20}
header .w{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.logo{font-weight:900;font-size:24px;letter-spacing:-.5px}.logo i{color:var(--coral);font-style:normal}
nav{display:flex;gap:26px;font-size:14px;color:var(--mut)}nav a:hover{color:var(--coral)}
.cart{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;border-radius:99px;padding:6px 18px;font-size:14px;font-weight:600;box-shadow:0 8px 20px -6px var(--coral)}
.cart span{background:#fff;color:var(--dark);border-radius:99px;padding:0 8px;margin-right:6px;font-size:12px}
.hero{position:relative;overflow:hidden;padding:56px 0 70px;background:linear-gradient(120deg,#8f72f5,#b89bff,#e56fb0,#8f72f5);background-size:300% 300%;animation:sh 14s ease infinite}
.o{position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none}
.o1{width:360px;height:360px;background:#fff;opacity:.4;top:-120px;left:-80px;animation:fl 9s ease-in-out infinite}
.o2{width:300px;height:300px;background:#1b2130;opacity:.35;bottom:-120px;right:30%;animation:fl 11s ease-in-out infinite reverse}
.big{position:absolute;inset:auto 0 -.18em;text-align:center;font:900 clamp(130px,30vw,380px)/1 Vazirmatn,sans-serif;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.4);pointer-events:none;direction:ltr}
.hg{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
.txt{background:rgba(20,25,38,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:64px 240px 64px 64px;padding:52px 44px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.txt small{display:inline-block;background:rgba(255,255,255,.12);border-radius:99px;padding:2px 14px;font-size:12px}
.txt h1{font-size:clamp(28px,4.6vw,46px);line-height:1.45;font-weight:900;margin:12px 0}
.gt{background:linear-gradient(90deg,#d9c9ff,#e56fb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.txt p{color:#c4cad4;font-size:14px;margin-bottom:26px}
.btn{position:relative;overflow:hidden;display:inline-block;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;border:0;border-radius:99px;padding:12px 32px;font:700 14px Vazirmatn,Tahoma,sans-serif;cursor:pointer;box-shadow:0 12px 28px -8px var(--coral);transition:.25s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.stage{position:relative;aspect-ratio:1;display:grid;place-items:center}
.stage::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.08) 70%);}
.ring{position:absolute;inset:2%;border-radius:50%;border:2px dashed rgba(255,255,255,.7);animation:rot 28s linear infinite}
.stage svg{width:78%;position:relative;filter:drop-shadow(0 30px 30px rgba(0,0,0,.25))}
.fl{animation:fl 5s ease-in-out infinite}
.chip{position:absolute;background:rgba(255,255,255,.85);color:#1b2130;backdrop-filter:blur(10px);border-radius:16px;padding:6px 14px;font-size:12px;font-weight:700;box-shadow:0 14px 30px -10px rgba(0,0,0,.35);animation:fl 6s ease-in-out infinite}
.c1{top:8%;left:0}.c2{bottom:12%;right:-2%;animation-delay:-3s}
.mq{direction:ltr;overflow:hidden;background:var(--dark);color:#fff;padding:12px 0;white-space:nowrap}
.mq div{display:inline-block;animation:mq 26s linear infinite;font-weight:700;font-size:14px;direction:rtl}
.mq span{margin:0 26px}.mq b{color:var(--coral)}
h2{font-size:clamp(22px,3vw,30px);font-weight:900;margin:64px 0 20px}
h2 small{display:block;color:var(--coral);font-size:12px;letter-spacing:1px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{border-radius:24px;padding:18px 14px 12px;text-align:center;font-weight:700;font-size:14px;transition:.3s;cursor:pointer}
.cat:hover{transform:translateY(-8px) rotate(-1.5deg)}
.cat svg{width:72%;display:block;margin:0 auto 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{position:relative;display:block}
.card:nth-child(1){grid-column:span 2}.card:nth-child(1) .im{aspect-ratio:2/1}
.card .im{position:relative;border-radius:28px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;transition:.4s;box-shadow:0 20px 40px -24px rgba(27,33,48,.5)}
.card .im::after{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(30px);transition:.4s}
.card .im svg{height:84%;position:relative;z-index:1;transition:.5s cubic-bezier(.2,.8,.2,1)}
.card:hover .im{box-shadow:0 30px 50px -20px var(--coral)}
.card:hover .im svg{transform:scale(1.12) rotate(-4deg)}
.card h3{font-size:15px;margin-top:12px;font-weight:700}.card b{color:var(--coral);font-size:14px}
.bd{position:absolute;top:14px;right:14px;z-index:2;background:var(--dark);color:#fff;font-size:11px;border-radius:99px;padding:0 12px}
.q{position:absolute;bottom:60px;left:14px;z-index:2;width:42px;height:42px;border-radius:50%;background:#fff;color:#1b2130;display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 10px 20px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:.3s}
.card:hover .q{transform:none;opacity:1}
.band{position:relative;overflow:hidden;background:linear-gradient(120deg,#1b2130,#2c3550,#1b2130);background-size:200% 200%;animation:sh 10s ease infinite;color:#fff;border-radius:32px;padding:44px;margin-top:64px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.band::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--coral);filter:blur(70px);opacity:.5;top:-100px;left:-60px}
.band>*{position:relative}.band h3{font-size:24px;font-weight:900}.band p{color:#c4cad4;font-size:14px}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.perk{background:var(--soft);border-radius:20px;padding:14px;text-align:center;font-size:12px;color:var(--mut)}.perk i{display:block;font-size:22px;font-style:normal}
footer{margin-top:70px;border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:13px;text-align:center}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;margin-top:28px;align-items:start}
.main{position:relative;border-radius:32px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--t) 38%,transparent),transparent 66%),var(--soft);transition:background .5s}
.main::before{content:"";position:absolute;inset:10%;border-radius:50%;border:2px dashed color-mix(in srgb,var(--t) 50%,transparent);animation:rot 40s linear infinite}
.tl{width:78%;transition:transform .15s;position:relative}.tl svg{width:100%;filter:drop-shadow(0 26px 24px rgba(0,0,0,.25))}
.th{display:flex;gap:12px;margin-top:14px}
.th button{width:76px;height:76px;border-radius:18px;border:2px solid transparent;background:var(--soft);cursor:pointer;padding:8px;transition:.2s}
.th button:hover{transform:translateY(-3px)}.th button.on{border-color:var(--coral)}.th svg{width:100%;animation:none}
.pd h1{font-size:30px;font-weight:900;line-height:1.4}
.st{color:#ffb020;font-size:14px}.st em{color:var(--mut);font-style:normal;margin-right:6px}
.price{font-size:26px;font-weight:900;margin:6px 0 12px;background:linear-gradient(90deg,var(--coral),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.lbl{font-size:13px;color:var(--mut);margin:18px 0 8px}
.sw,.sz{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:.2s}.sw button:hover{transform:scale(1.12)}
.sw button.on{outline:2px solid var(--coral);outline-offset:3px}
.sz button{min-width:50px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;transition:.2s}
.sz button.on{background:var(--dark);color:#fff;border-color:var(--dark);transform:translateY(-2px)}
.buy{margin-top:24px}.buy .btn{width:100%;padding:16px;font-size:16px}
details{border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}summary{cursor:pointer;font-weight:700}
details p{color:var(--mut);margin-top:6px}
.crumb{font-size:13px;color:var(--mut);margin-top:22px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@keyframes fl{50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sh{50%{background-position:100% 50%}}
@keyframes shine{to{left:130%}}
@keyframes mq{to{transform:translateX(-50%)}}
@media(max-width:760px){
nav{display:none}
.hg,.pd{grid-template-columns:1fr}
.txt{padding:34px 24px;border-radius:44px 120px 44px 44px}
.stage{max-width:340px;margin:auto;width:100%}
.cats{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.card:nth-child(1) .im{aspect-ratio:2/1.1}
.q{opacity:1;transform:none;width:34px;height:34px;font-size:18px;bottom:56px}
.band{padding:30px}
.buy{position:sticky;bottom:10px;z-index:5}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.grid{grid-template-columns:repeat(6,1fr)}
.card,.card:nth-child(1){grid-column:span 2}.card:nth-child(4){grid-column:2/4}
.card .im,.card:nth-child(1) .im{aspect-ratio:3/4}.card .im::after{display:none}
.im img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;display:block;transition:.6s cubic-bezier(.2,.8,.2,1)}
.card:hover .im img{transform:scale(1.08)}
.cat{padding:0 0 12px;overflow:hidden}.cat img{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-bottom:10px;transition:.5s}.cat:hover img{transform:scale(1.08)}
.stage .ph{position:absolute;object-fit:cover;aspect-ratio:3/4;border-radius:28px;border:4px solid rgba(255,255,255,.9);box-shadow:0 30px 60px -20px rgba(0,0,0,.55);animation:fl 7s ease-in-out infinite;z-index:1}
.p1{width:48%;top:0;right:4%;rotate:4deg}.p2{width:44%;bottom:2%;left:0;rotate:-6deg;animation-delay:-2s}.p3{width:32%;bottom:6%;right:6%;rotate:8deg;animation-delay:-4s;z-index:2}
.chip{z-index:3}
.main{aspect-ratio:4/5}.main::before{display:none}.tl{width:100%;height:100%}.tl img{width:100%;height:100%;object-fit:cover;display:block}
.th button{padding:0;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.card,.card:nth-child(4){grid-column:auto}.card:nth-child(1){grid-column:1/-1}.card:nth-child(1) .im{aspect-ratio:1}.stage{aspect-ratio:1/1.05}}
</style>
</head>

<div style="margin-top:20px"><details open><summary>توضیحات</summary><p>${p.d} پارچه با کیفیت و دوخت مقاوم.</p></details><details><summary>راهنمای سایز</summary><p>برای انتخاب سایز مناسب، جدول سایز را بررسی کنید.</p></details><details><summary>ارسال و بازگشت</summary><p>ارسال به سراسر کشور و بازگشت کالا تا ۷ روز.</p></details></div></div></div>
<h2 class="rv"><small>پیشنهاد</small>محصولات مشابه</h2><div class="grid">${P.filter(x=>x.id!=p.id).slice(0,3).map((x,i)=>card(x,i+1).replace("card rv","card rv in")).join("")}</div></div>`}
let io;
function draw(){document.getElementById("app").innerHTML=cur?prod(cur):home();
io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el))}
function route(){const h=location.hash;cur=h.startsWith("#p")?+h.slice(2):0;col=0;ph=0;sz="";draw();scrollTo(0,0)}
function setc(i){col=i;draw()}function setph(i){ph=i;draw()}function sets(s){sz=s;draw()}
function add(){cnt++;document.getElementById("n").textContent=fa(cnt);const b=document.getElementById("add");b.textContent="✓ به سبد اضافه شد";setTimeout(()=>b.textContent="افزودن به سبد خرید",1300)}
document.addEventListener("pointermove",e=>{const m=e.target.closest&&e.target.closest(".main");if(!m)return;const r=m.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;m.firstElementChild.style.transform=`perspective(700px) rotateY(${x*18}deg) rotateX(${-y*18}deg)`});
document.addEventListener("pointerout",e=>{if(e.target.classList&&e.target.classList.contains("main"))e.target.firstElementChild.style.transform=""});
addEventListener("hashchange",route);route();
</script>
</body>
